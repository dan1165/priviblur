name: Priviblur CI

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00
  push:
    branches:
      - "master"
  pull_request:
    branches: "*"
    paths-ignore:
      - "*.md"
      - screenshots/*
      - utils/**
      - assets/**

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build and test on ${{matrix.python-version}}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: |
          ./requirements.txt
          utils/i18n/requirements.txt
          ./requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r utils/i18n/requirements.txt

    - name: Commit static locale data changes if applicable
      if: github.event_name == 'push' && matrix.python-version == '3.13'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Regenerate static locale data"
        file_pattern: 'src/i18n/i18n_data.py'

    - name: Setup config
      run: cp config.example.toml config.toml

    - name: Compile locales
      run: pybabel compile -d locales -D priviblur

    - name: Run Priviblur
      run: |
        python -m src.server &

    - name: Wait and test
      run: |
        for attempt in $(seq 1 30); do
          curl -fsS http://localhost:8000/settings > /dev/null && \
          curl -fsS http://localhost:8000/priviblur/licences > /dev/null && exit 0
          sleep 2
        done
        exit 1

  docker:
    runs-on: ubuntu-latest
    name: "Build Docker image (amd64 + arm64)"
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-static-locale-data:
    name: "Regenerate static locale data if applicable"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "write"

    steps:
      - uses: actions/checkout@v7

      - name: "Set up python 3.13"
        uses: actions/setup-python@v7
        with:
         python-version: 3.13
         cache: "pip"
         cache-dependency-path: |
          utils/i18n/requirements.txt
          ./requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r 'utils/i18n/requirements.txt'
          pip install -r 'requirements-dev.txt'

      - name: Generate locale data
        run: python ./utils/i18n/generate.py

      - name: Format static locale data file
        run: ruff format src/i18n/i18n_data.py

      - name: Commit if applicable
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Regenerate static locale data"
          file_pattern: 'src/i18n/i18n_data.py'

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
          cache: "pip"
          cache-dependency-path: |
            ./requirements.txt
            utils/i18n/requirements.txt
            ./requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r utils/i18n/requirements.txt

      - name: Generate locale data
        run: python ./utils/i18n/generate.py

      - name: Format static locale data file
        run: ruff format src/i18n/i18n_data.py

      - name: Lint with Ruff
        run: ruff check --output-format=github .

      - name: Check formatter compliance
        run: ruff format --check
