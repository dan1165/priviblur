name: priviblur-dev

services:
  priviblur:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: priviblur:local
    container_name: priviblur
    restart: unless-stopped
    command: ["python3", "-m", "sanic", "src.server.app", "--dev", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: UTC
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config.toml:/priviblur/config.toml:ro
      - ./src:/priviblur/src:ro
      - ./assets:/priviblur/assets:ro
    depends_on:
      priviblur-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/settings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  priviblur-redis:
    image: redis:8-alpine
    container_name: priviblur-redis
    command: ["redis-server", "--loglevel", "warning", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - priviblur-redis:/data
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  priviblur-redis:
