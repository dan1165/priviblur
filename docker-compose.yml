name: priviblur

services:
  priviblur:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: priviblur:local
    container_name: priviblur
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      TZ: UTC
    volumes:
      - ./config.toml:/priviblur/config.toml:ro
    depends_on:
      priviblur-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/settings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  priviblur-redis:
    image: redis:8-alpine
    container_name: priviblur-redis
    command: ["redis-server", "--loglevel", "warning"]
    volumes:
      - priviblur-redis:/data
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  priviblur-redis:
